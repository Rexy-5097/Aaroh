project:
  name: Aaroh
  version: 0.0.0
  profile: aaroh
  # Ratified by ADR-0058. Aaroh is polyglot: TypeScript clients over a Python
  # backend that holds the canonical decision engine (ADR-0059).
  framework: FastAPI + Expo/React Native + Next.js
  languages:
  - Python
  - TypeScript
  owner: Rexy-5097
  # PROJECT_CONFIG.example.yaml marks `goals` as Required, but
  # bootstrap_project.py omits it when writing this file. Restored by hand.
  goals: A transparent, constraint-aware career decision engine that helps students
    identify the highest-impact use of their limited preparation time. The Career
    Readiness Score is a transparent measurement inside the system, not the product
    itself.
  deadline: UNDECIDED
  status: INITIALIZED
enabled_features:
  # Mirrors profiles/aaroh.yaml. See that file for why each generic AgentOS
  # standard/agent/gate is included or deliberately excluded.
  standards:
  - standards/code_quality.md
  - standards/testing.md
  - standards/security.md
  - standards/privacy.md
  - standards/decision_engine.md
  - standards/llm_integration.md
  - standards/api_design.md
  agents:
  - agents/orchestrator.md
  - agents/chief-architect.md
  - agents/security-reviewer.md
  - agents/llm-reviewer.md
  - agents/qa-reviewer.md
  - agents/docs-reviewer.md
  quality_gates:
  - QG-001
  - QG-002
  - QG-003
  - QG-005
  - QG-009
  - QG-010
  - QG-011
  metrics:
  - metrics/quality.md
