version: 2

# Kept deliberately small. Ecosystems are added when Aaroh actually has
# manifests for them (npm/pnpm at Stage 0, per ADR-0058), not in advance.

updates:
  # GitHub Actions are a supply-chain surface from day one -- Aaroh's CI runs
  # third-party actions over the whole repository, including the secret scan.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"

  # Vendored AgentOS toolchain (PyYAML only, today).
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
