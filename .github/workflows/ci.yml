name: CI

# Aaroh's primary gate. Every pull request into main must pass this before
# merge. At Stage 0 this validates the AgentOS governance layer; application
# test jobs are added to this same workflow as the code they test appears.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agentos-validation:
    name: AgentOS validation baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AgentOS toolchain
        # tools/requirements.txt is the vendored AgentOS toolchain only
        # (PyYAML). Aaroh has no application dependencies yet, by design.
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt

      - name: Assert validation baseline has not regressed
        run: python .github/scripts/check_agentos_baseline.py

  governance:
    name: Aaroh governance checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce ADR-0058 / ADR-0059 / ADR-0060 / ADR-0061 / ADR-0062
        # Checks report ARMED until their subject exists, then begin failing on
        # violation. See the script header.
        run: python .github/scripts/check_governance.py

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest

      - name: Regression tests for the governance checks themselves
        # A security check that silently stops working is worse than no check,
        # because it is trusted. These pin both directions of the I-5 matcher.
        # No database required.
        run: python -m pytest .github/scripts/tests -q

  rls-tests:
    name: RLS isolation tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Real PostgreSQL, pinned. RLS is PostgreSQL behaviour, so it is tested
    # against PostgreSQL rather than against a mock (ADR-0061 Testing Strategy).
    # Keep this major version aligned with the Supabase project's version.
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aaroh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt

      - name: Run RLS isolation and structural tests
        working-directory: backend
        env:
          AAROH_TEST_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/aaroh_test
          AAROH_TEST_APP_DSN: postgresql://aaroh_app:aaroh_app@127.0.0.1:5432/aaroh_test
        run: python -m pytest tests -v --tb=short
